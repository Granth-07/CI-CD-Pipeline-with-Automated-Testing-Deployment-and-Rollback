name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: |
          pytest -v

      - name: Alert on test failure
        if: failure()
        run: |
          echo "::error::CI/CD failure at TEST stage for commit ${{ github.sha }}"
          # Slack Webhook Alert Example:
          # curl -X POST -H 'Content-type: application/json' \
          #   --data '{"text":"🚨 Test failed for commit ${{ github.sha }}"}' \
          #   ${{ secrets.SLACK_WEBHOOK_URL }}
          exit 1

  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rag-retrieval-api:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/rag-retrieval-api:latest

      - name: Alert on build failure
        if: failure()
        run: |
          echo "::error::CI/CD failure at BUILD-PUSH stage for commit ${{ github.sha }}"
          # Slack Webhook Alert Example:
          # curl -X POST -H 'Content-type: application/json' \
          #   --data '{"text":"🚨 Build failed for commit ${{ github.sha }}"}' \
          #   ${{ secrets.SLACK_WEBHOOK_URL }}
          exit 1

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy deployment script to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "scripts/deploy.sh"
          target: "/opt/app"

      - name: Execute remote deployment on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            chmod +x /opt/app/scripts/deploy.sh
            /opt/app/scripts/deploy.sh ${{ secrets.DOCKERHUB_USERNAME }}/rag-retrieval-api:${{ github.sha }}

      - name: Alert on deployment failure
        if: failure()
        run: |
          echo "::error::CI/CD failure at DEPLOY stage for commit ${{ github.sha }}"
          # Slack Webhook Alert Example:
          # curl -X POST -H 'Content-type: application/json' \
          #   --data '{"text":"🚨 Deploy/Rollback triggered for commit ${{ github.sha }}"}' \
          #   ${{ secrets.SLACK_WEBHOOK_URL }}
          exit 1
